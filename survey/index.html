<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex,nofollow" />
<title>סקר קצר: העדפות רכות</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%232563eb'/%3E%3Cpath d='M16 34l12 12 20-26' stroke='white' stroke-width='6' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
<style>
  :root {
    color-scheme: light;
    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #0f172a;
    --muted: #475569;
    --border: #e2e8f0;
    --accent: #2563eb;
    --accent-strong: #1d4ed8;
    --accent-soft: #e0e7ff;
    --ok: #15803d;
    --err: #b91c1c;
    --shadow: 0 18px 40px rgba(15, 23, 42, 0.12);
    --radius: 18px;
  }
  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: "Inter", "SF Pro Text", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  }
  body {
    background: radial-gradient(circle at top, #eef2ff 0%, var(--bg) 45%, #f3f6fb 100%);
    color: var(--text);
    min-height: 100vh;
    padding: 0 14px 48px;
    line-height: 1.55;
    font-size: 17px;
  }
  .topbar {
    position: sticky;
    top: 0;
    z-index: 5;
    margin: 0 -14px 18px;
    padding: 10px 14px;
    background: rgba(246, 247, 251, 0.92);
    backdrop-filter: blur(6px);
  }
  .bar {
    height: 8px;
    background: var(--border);
    border-radius: 999px;
    overflow: hidden;
  }
  .bar > div {
    height: 100%;
    width: 0;
    background: linear-gradient(90deg, var(--accent), #60a5fa);
    border-radius: 999px;
    transition: width 0.3s ease;
  }
  main { max-width: 640px; margin: 0 auto; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 22px 18px;
    box-shadow: var(--shadow);
    display: grid;
    gap: 16px;
  }
  h1 { font-size: 26px; line-height: 1.25; letter-spacing: -0.01em; }
  h2 { font-size: 20px; line-height: 1.35; }
  h1:focus, h2:focus { outline: none; }
  p, li { font-size: 17px; }
  ul { padding-inline-start: 22px; display: grid; gap: 8px; }
  .muted { color: var(--muted); font-size: 15px; }
  .badge {
    justify-self: start;
    background: var(--accent-soft);
    color: var(--accent-strong);
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
  }
  .quote-label { font-weight: 600; color: var(--muted); font-size: 15px; }
  .quote {
    background: #eef2ff;
    border-inline-start: 5px solid var(--accent);
    border-radius: 14px;
    padding: 16px;
    font-size: 21px;
    font-weight: 600;
    line-height: 1.4;
  }
  .opts { display: grid; gap: 10px; }
  button {
    font: inherit;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible,
  .choice:focus-within {
    outline: 3px solid #f59e0b;
    outline-offset: 2px;
  }
  .opt {
    width: 100%;
    min-height: 88px;
    text-align: start;
    background: #fff;
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 14px 16px;
    display: grid;
    gap: 4px;
    color: var(--text);
  }
  .opt:active { border-color: var(--accent); background: #f5f8ff; }
  @media (hover: hover) { .opt:hover { border-color: var(--accent); background: #f5f8ff; } }
  .opt.ans { display: block; min-height: 40px; padding: 6px 14px; font-size: 16px; font-weight: 600; border-radius: 12px; }
  .opts:has(.ans) { gap: 6px; }
  .card:has(.ans) { padding-top: 14px; padding-bottom: 14px; }
  .card:has(.ans) .quote { font-size: 19px; padding: 10px 14px; margin: 6px 0 8px; }
  .card:has(.ans) h2 { font-size: 18px; margin: 8px 0; }
  .card:has(.ans) p { margin: 4px 0; }
  .opt.picked { border-color: var(--accent); background: #e0e7ff; }
  .btn {
    min-height: 52px;
    border: none;
    border-radius: 14px;
    padding: 12px 20px;
    font-size: 18px;
    font-weight: 700;
    background: var(--accent);
    color: #fff;
    width: 100%;
  }
  .btn:hover { background: var(--accent-strong); }
  .btn:disabled { background: #94a3b8; cursor: not-allowed; }
  .btn.secondary { background: #fff; color: var(--accent-strong); border: 2px solid var(--accent); }
  .field { display: grid; gap: 10px; }
  .field > .q { font-weight: 700; }
  .choice {
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 52px;
    padding: 10px 14px;
    border: 2px solid var(--border);
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    font-size: 17px;
  }
  .choice input { width: 24px; height: 24px; flex: none; accent-color: var(--accent); }
  .choice:has(input:checked) { border-color: var(--accent); background: #f5f8ff; }
  .consent { background: #f8fafc; }
  input[type="number"], textarea {
    width: 100%;
    border: 2px solid var(--border);
    background: #fbfcff;
    border-radius: 12px;
    padding: 12px;
    font-size: 18px;
    color: var(--text);
  }
  textarea { min-height: 130px; resize: vertical; }
  .unit-row { display: flex; align-items: center; gap: 10px; }
  .unit-row input { max-width: 160px; }
  .err { color: var(--err); font-weight: 600; font-size: 16px; min-height: 1.2em; }
  .ok { color: var(--ok); }
  .status-box { border-radius: 14px; padding: 16px; font-weight: 600; }
  .status-box.ok { background: #dcfce7; color: #14532d; }
  .status-box.fail { background: #fee2e2; color: #7f1d1d; }
  .note { background: #fef9c3; border-radius: 12px; padding: 12px 14px; font-size: 16px; }
  .center { text-align: center; }
  .hidden { display: none !important; }
  .json { font-family: ui-monospace, Consolas, monospace; font-size: 13px; direction: ltr; text-align: left; min-height: 220px; }
  @media (min-width: 700px) { .card { padding: 28px; } body { font-size: 18px; } }
</style>
</head>
<body>
<div class="topbar"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-label="Progress"><div id="bar-fill"></div></div></div>
<main id="screen" aria-live="polite"></main>

<script>
(function () {
  "use strict";

  /* ------------------------------------------------------------------ */
  /* TEXT: all interface strings (he / en). Light HTML (bdi) is allowed. */
  /* ------------------------------------------------------------------ */
  var TEXT = {
    he: {
      title: "סקר קצר: העדפות רכות",
      progress: "התקדמות",
      welcome_h: "סקר קצר: העדפות רכות",
      intro_route: "תתכננו נסיעה עבור חבר/ה. החבר/ה אומר/ת משפט, ואתם בוחרים עד כמה תלכו לקראתם.",
      intro_flight: "תזמינו טיסה עבור חבר/ה. החבר/ה אומר/ת משפט, ואתם בוחרים עד כמה תלכו לקראתם.",
      intro_small: "הסקר אורך כדקה אחת, והוא אנונימי. לשאלות: <bdi dir=\"ltr\">me@orifogler.com</bdi>",
      start: "להתחלה",
      friend_said: "החבר/ה שלך אמר/ה:",
      ctx_route: "הדרך המהירה עוברת בכביש המהיר ואורכת {x}.",
      ctx_flight: "טיסה עם עצירת ביניים עולה {x}.",
      q_route: "עד איזה אורך נסיעה תבחרו עבורם במסלול בלי הכביש המהיר?",
      q_flight: "עד איזה מחיר תבחרו עבורם בטיסה ישירה?",
      up_to: "עד ",
      never_route: "בכלל לא — תמיד הכביש המהיר",
      never_flight: "בכלל לא — תמיד עם עצירת ביניים",
      always_route: "בכל מקרה — תמיד בלי הכביש המהיר",
      always_flight: "בכל מקרה — תמיד טיסה ישירה",
      sending: "שולחים…",
      thanks_h: "תודה רבה!",
      ok_msg: "התשובות נשלחו בהצלחה. תודה על ההשתתפות.",
      fail_msg: "לא הצלחנו לשלוח כרגע. התשובות שמורות במכשיר. אפשר לנסות שוב.",
      retry: "ניסיון חוזר",
      email_msg: "אם השליחה ממשיכה להיכשל, העתיקו את הטקסט ושלחו אותו במייל אל <bdi dir=\"ltr\">me@orifogler.com</bdi>.",
      copy: "העתקה",
      copied: "הועתק",
      debug_msg: "מצב בדיקה: שום דבר לא נשלח. זה הקובץ הסופי:"
    },
    en: {
      title: "Short Survey: Soft Preferences",
      progress: "Progress",
      welcome_h: "Short Survey: Soft Preferences",
      intro_route: "You plan a drive for a friend. The friend says a sentence, and you pick how far you would go for them.",
      intro_flight: "You book a flight for a friend. The friend says a sentence, and you pick how far you would go for them.",
      intro_small: "The survey takes about 1 minute and is anonymous. Questions: <bdi dir=\"ltr\">me@orifogler.com</bdi>",
      start: "Start",
      friend_said: "Your friend said:",
      ctx_route: "The fast route uses the highway and takes {x}.",
      ctx_flight: "A flight with a stopover costs {x}.",
      q_route: "What is the longest no-highway route you would still choose for them?",
      q_flight: "What is the highest price at which you would still choose the direct flight for them?",
      up_to: "Up to ",
      never_route: "Never — always the highway",
      never_flight: "Never — always with a stopover",
      always_route: "Always — never the highway",
      always_flight: "Always — always the direct flight",
      sending: "Sending…",
      thanks_h: "Thank you!",
      ok_msg: "Your answers were sent. Thank you for taking part.",
      fail_msg: "We could not send your answers now. They are saved on your device. You can try again.",
      retry: "Try again",
      email_msg: "If sending keeps failing, copy the text and email it to <bdi dir=\"ltr\">me@orifogler.com</bdi>.",
      copy: "Copy",
      copied: "Copied",
      debug_msg: "Debug mode: nothing was sent. This is the final data:"
    }
  };

  /* ------------------------------------------------------------------ */
  /* ITEMS: phrases and answer scale. Edit wording here.                 */
  /* ------------------------------------------------------------------ */
  var ITEMS = {
    base: { route: 40, flight: 1000 },
    pcts: [10, 20, 50, 100, 200, 500],
    phrases: [
      { id: "slightly",
        route: { he: "אני קצת מעדיף/ה להימנע מהכביש המהיר.", en: "I slightly prefer to avoid the highway." },
        flight: { he: "אני קצת מעדיף/ה להימנע מטיסה עם עצירת ביניים.", en: "I slightly prefer to avoid a flight with a stopover." } },
      { id: "if_possible",
        route: { he: "אם אפשר, עדיף להימנע מהכביש המהיר.", en: "Avoid the highway if possible." },
        flight: { he: "אם אפשר, עדיף להימנע מטיסה עם עצירת ביניים.", en: "Avoid a flight with a stopover if possible." } },
      { id: "prefer",
        route: { he: "אני מעדיף/ה להימנע מהכביש המהיר.", en: "I prefer to avoid the highway." },
        flight: { he: "אני מעדיף/ה להימנע מטיסה עם עצירת ביניים.", en: "I prefer to avoid a flight with a stopover." } },
      { id: "strongly",
        route: { he: "אני מאוד מעדיף/ה להימנע מהכביש המהיר.", en: "I strongly prefer to avoid the highway." },
        flight: { he: "אני מאוד מעדיף/ה להימנע מטיסה עם עצירת ביניים.", en: "I strongly prefer to avoid a flight with a stopover." } },
      { id: "must",
        route: { he: "חייבים להימנע מהכביש המהיר.", en: "We must avoid the highway." },
        flight: { he: "חייבים להימנע מטיסה עם עצירת ביניים.", en: "We must avoid a flight with a stopover." } }
    ]
  };

  /* ------------------------------------------------------------------ */
  /* Setup                                                               */
  /* ------------------------------------------------------------------ */
  var params = new URLSearchParams(location.search);
  var LANG = params.get("lang") === "en" ? "en" : "he";
  var DEBUG = params.get("debug") === "1";
  var T = TEXT[LANG];
  var DOMAIN = params.get("domain");
  if (DOMAIN !== "route" && DOMAIN !== "flight") DOMAIN = Math.random() < 0.5 ? "route" : "flight";

  document.documentElement.lang = LANG;
  document.documentElement.dir = LANG === "he" ? "rtl" : "ltr";
  document.title = T.title;
  var STORE_KEY = "softpref_pilot2_payload";

  function shuffle(a) {
    a = a.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function randomId(n) {
    var chars = "abcdefghijkmnpqrstuvwxyz23456789", s = "";
    var arr = null;
    try { arr = new Uint8Array(n); crypto.getRandomValues(arr); } catch (e) { arr = null; }
    for (var i = 0; i < n; i++) s += chars.charAt((arr ? arr[i] : Math.floor(Math.random() * 256)) % chars.length);
    return s;
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  // Escape text and wrap numbers (with % sign) in <bdi> so they render correctly in RTL.
  function safeNums(s) {
    return esc(s).replace(/\d+(?:[.,]\d+)?%?/g, function (m) { return "<bdi>" + m + "</bdi>"; });
  }
  function phraseText(id) {
    for (var i = 0; i < ITEMS.phrases.length; i++) if (ITEMS.phrases[i].id === id) return ITEMS.phrases[i][DOMAIN][LANG];
    return "";
  }
  function fmtNum(n) { return Number(n).toLocaleString("en-US"); }

  function fmtMinutes(m) {
    var base = m + (LANG === "he" ? " דק׳" : " min");
    if (m < 60) return "<bdi>" + base + "</bdi>";
    var h = Math.floor(m / 60), r = m % 60, long;
    if (LANG === "he") {
      var hs = h === 1 ? "שעה" : h === 2 ? "שעתיים" : h + " שעות";
      long = r ? hs + " ו-" + r + " דק׳" : hs;
    } else {
      long = h + " h" + (r ? " " + r + " min" : "");
    }
    return "<bdi>" + base + "</bdi> (<bdi>" + long + "</bdi>)";
  }
  function fmtCost(v) {
    if (DOMAIN === "route") return fmtMinutes(v);
    return LANG === "he" ? "<bdi>" + fmtNum(v) + " ₪</bdi>" : "<bdi>₪" + fmtNum(v) + "</bdi>";
  }

  // Fixed answer scale, lowest to highest. Returns [{pct, html}].
  function answerScale() {
    var base = ITEMS.base[DOMAIN];
    var list = [{ pct: 0, html: esc(DOMAIN === "route" ? T.never_route : T.never_flight) }];
    ITEMS.pcts.forEach(function (p) {
      list.push({ pct: p, html: esc(T.up_to) + fmtCost(Math.round(base * (1 + p / 100))) });
    });
    list.push({ pct: "no_limit", html: esc(DOMAIN === "route" ? T.always_route : T.always_flight) });
    return list;
  }

  /* ------------------------------------------------------------------ */
  /* State                                                               */
  /* ------------------------------------------------------------------ */
  var S = {
    version: "pilot-2",
    lang: LANG,
    domain: DOMAIN,
    started_at: null,
    finished_at: null,
    user_agent_mobile: /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent || ""),
    phrase_order: shuffle(ITEMS.phrases.map(function (p) { return p.id; })),
    answers: {},
    participant_id: randomId(8)
  };
  var RT = { // runtime (not part of payload)
    active: false, submitted: false, sending: false, tries: 0,
    idx: 0, qStart: 0, locked: false
  };
  if (DEBUG) window.__survey = S;
  if (DEBUG) window.__survey_rt = RT;

  var $screen = document.getElementById("screen");
  var $bar = document.getElementById("bar-fill");
  var $barWrap = $bar.parentNode;

  function setProgress(answered) {
    var pct = Math.max(0, Math.min(100, Math.round(answered / S.phrase_order.length * 100)));
    $bar.style.width = pct + "%";
    $barWrap.setAttribute("aria-valuenow", String(pct));
    $barWrap.setAttribute("aria-label", T.progress);
  }
  function now() { return (window.performance && performance.now) ? performance.now() : Date.now(); }

  function show(html, focusSel) {
    $screen.innerHTML = html;
    window.scrollTo(0, 0);
    var f = $screen.querySelector(focusSel || "h1, h2");
    if (f) { f.setAttribute("tabindex", "-1"); try { f.focus({ preventScroll: true }); } catch (e) {} }
  }

  /* ------------------------------------------------------------------ */
  /* Screens                                                             */
  /* ------------------------------------------------------------------ */
  function screenIntro() {
    setProgress(0);
    show(
      '<section class="card">' +
      "<h1>" + T.welcome_h + "</h1>" +
      "<p>" + (DOMAIN === "route" ? T.intro_route : T.intro_flight) + "</p>" +
      '<p class="muted">' + T.intro_small + "</p>" +
      '<button class="btn" id="start">' + T.start + "</button>" +
      "</section>"
    );
    document.getElementById("start").addEventListener("click", function () {
      S.started_at = new Date().toISOString();
      RT.active = true;
      screenQuestion(0);
    });
  }

  function screenQuestion(i) {
    var id = S.phrase_order[i];
    RT.idx = i;
    RT.locked = false;
    setProgress(i);
    var ctx = (DOMAIN === "route" ? T.ctx_route : T.ctx_flight).replace("{x}", "§X§");
    var ctxHtml = esc(ctx).replace("§X§", fmtCost(ITEMS.base[DOMAIN]));
    var btns = answerScale().map(function (a) {
      return '<button type="button" class="opt ans" data-pct="' + a.pct + '">' + a.html + "</button>";
    }).join("");
    show(
      '<section class="card">' +
      '<span class="badge"><bdi>' + (i + 1) + " / " + S.phrase_order.length + "</bdi></span>" +
      '<div class="quote-label">' + T.friend_said + "</div>" +
      '<blockquote class="quote">' + safeNums(phraseText(id)) + "</blockquote>" +
      '<p class="muted">' + ctxHtml + "</p>" +
      "<h2>" + (DOMAIN === "route" ? T.q_route : T.q_flight) + "</h2>" +
      '<div class="opts">' + btns + "</div>" +
      "</section>",
      ".badge"
    );
    RT.qStart = now();
    Array.prototype.forEach.call($screen.querySelectorAll(".opt"), function (b) {
      b.addEventListener("click", function () {
        if (RT.locked) return;
        RT.locked = true;
        var raw = b.getAttribute("data-pct");
        S.answers[id] = { pct: raw === "no_limit" ? "no_limit" : Number(raw), rt_ms: Math.round(now() - RT.qStart) };
        b.classList.add("picked");
        setProgress(i + 1);
        window.setTimeout(function () {
          if (i + 1 < S.phrase_order.length) screenQuestion(i + 1);
          else finish();
        }, 150);
      });
    });
  }

  function finish() {
    S.finished_at = new Date().toISOString();
    try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) {}
    screenThanks();
    if (!DEBUG) doSend();
  }

  /* ------------------------------------------------------------------ */
  /* Submission                                                          */
  /* ------------------------------------------------------------------ */
  function screenThanks() {
    var body;
    if (DEBUG) {
      body = '<p class="status-box ok">' + T.debug_msg + '</p><textarea class="json" readonly id="json">' + esc(JSON.stringify(S, null, 2)) + "</textarea>";
    } else {
      body = '<div id="status" class="status-box" role="status">' + T.sending + "</div>" +
        '<div id="fallback" class="hidden field"><p>' + T.email_msg + '</p><textarea class="json" readonly id="json"></textarea>' +
        '<button type="button" class="btn secondary" id="copy">' + T.copy + "</button></div>" +
        '<button type="button" class="btn hidden" id="retry">' + T.retry + "</button>";
    }
    show('<section class="card"><h2>' + T.thanks_h + "</h2>" + body + "</section>");
    var copy = document.getElementById("copy");
    if (copy) copy.addEventListener("click", doCopy);
    var retry = document.getElementById("retry");
    if (retry) retry.addEventListener("click", function () { if (!RT.sending && !RT.submitted) doSend(); });
  }

  function doCopy() {
    var ta = document.getElementById("json");
    var btn = document.getElementById("copy");
    var txt = ta.value;
    function done() { btn.textContent = T.copied; window.setTimeout(function () { btn.textContent = T.copy; }, 1500); }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(txt).then(done, function () { ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} });
    } else {
      ta.select();
      try { document.execCommand("copy"); done(); } catch (e) {}
    }
  }

  function doSend() {
    if (RT.sending || RT.submitted) return;
    RT.sending = true;
    var status = document.getElementById("status");
    var retry = document.getElementById("retry");
    status.className = "status-box";
    status.textContent = T.sending;
    retry.classList.add("hidden");
    var body = {
      _subject: "Soft-preference survey pilot-2 " + S.participant_id,
      _template: "box",
      _captcha: "false",
      participant_id: S.participant_id,
      domain: S.domain,
      lang: S.lang,
      data: JSON.stringify(S)
    };
    fetch("https://formsubmit.co/ajax/me@orifogler.com", {
      method: "POST",
      headers: { "Accept": "application/json", "Content-Type": "application/json" },
      body: JSON.stringify(body)
    }).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.json().catch(function () { return {}; });
    }).then(function (j) {
      if (j && (j.success === "false" || j.success === false)) throw new Error("rejected");
      RT.submitted = true;
      RT.sending = false;
      RT.active = false;
      status.className = "status-box ok";
      status.textContent = T.ok_msg;
      try { localStorage.setItem(STORE_KEY + "_sent", S.participant_id); } catch (e) {}
    }).catch(function () {
      RT.sending = false;
      RT.tries++;
      status.className = "status-box fail";
      status.textContent = T.fail_msg;
      retry.classList.remove("hidden");
      if (RT.tries >= 2) {
        document.getElementById("json").value = JSON.stringify(S);
        document.getElementById("fallback").classList.remove("hidden");
      }
    });
  }

  window.addEventListener("beforeunload", function (e) {
    if (RT.active && !RT.submitted) {
      e.preventDefault();
      e.returnValue = "";
      return "";
    }
  });

  screenIntro();
})();
</script>
</body>
</html>
