<svg xmlns="http://www.w3.org/2000/svg" width="640" height="560" viewBox="0 0 640 560" role="img" aria-labelledby="title desc">
  <title id="title">Where the KV cache sits in a decoder-only transformer</title>
  <desc id="desc">The newly selected token on passes through embedding, transformer layers, final normalization, and the language-model head to predict the next token. Each transformer layer reads its own earlier keys and values and appends the keys and values computed for on. The caches are separate across layers.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52675e"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#25352e;font-size:16px}.small{font-size:13px;fill:#52675e}.label{font-weight:700}.box{fill:#fff;stroke:#aab8af;stroke-width:1.5}.current{fill:#edf3fa;stroke:#54779c;stroke-width:1.5}.cache{fill:#eef5ed;stroke:#6a876b;stroke-width:1.5}.flow{fill:none;stroke:#52675e;stroke-width:1.7;marker-end:url(#arrow)}</style>
  <rect width="640" height="560" fill="#fff"/>
  <text x="28" y="25" class="small">ONE DECODE PASS · PROCESS “on”, THEN PREDICT WHAT FOLLOWS</text>
  <rect class="current" x="28" y="44" width="270" height="48" rx="5"/>
  <text x="163" y="74" text-anchor="middle" class="label">New token: on</text>
  <path class="flow" d="M163 92V112"/>
  <rect class="box" x="28" y="114" width="270" height="42" rx="5"/>
  <text x="163" y="141" text-anchor="middle">Token embedding</text>
  <path class="flow" d="M163 156V178"/>
  <text x="492" y="147" text-anchor="middle" class="small">Separate saved activations per layer</text>
  <rect class="current" x="28" y="180" width="270" height="50" rx="5"/>
  <text x="163" y="211" text-anchor="middle" class="label">Transformer layer 1</text>
  <rect class="cache" x="385" y="180" width="227" height="50" rx="5"/>
  <text x="498" y="201" text-anchor="middle" class="label">Layer 1 KV cache</text>
  <text x="498" y="220" text-anchor="middle" class="small">The · cat · sat + on</text>
  <path class="flow" marker-start="url(#arrow)" d="M302 208H381"/>
  <text x="341" y="195" text-anchor="middle" class="small">read / add</text>
  <path class="flow" d="M163 230V250"/>
  <rect class="current" x="28" y="252" width="270" height="50" rx="5"/>
  <text x="163" y="283" text-anchor="middle" class="label">Transformer layer 2</text>
  <rect class="cache" x="385" y="252" width="227" height="50" rx="5"/>
  <text x="498" y="273" text-anchor="middle" class="label">Layer 2 KV cache</text>
  <text x="498" y="292" text-anchor="middle" class="small">The · cat · sat + on</text>
  <path class="flow" marker-start="url(#arrow)" d="M302 280H381"/>
  <text x="341" y="267" text-anchor="middle" class="small">read / add</text>
  <text x="163" y="326" text-anchor="middle">⋮</text><text x="498" y="326" text-anchor="middle">⋮</text>
  <rect class="current" x="28" y="338" width="270" height="50" rx="5"/>
  <text x="163" y="369" text-anchor="middle" class="label">Transformer layer N</text>
  <rect class="cache" x="385" y="338" width="227" height="50" rx="5"/>
  <text x="498" y="359" text-anchor="middle" class="label">Layer N KV cache</text>
  <text x="498" y="378" text-anchor="middle" class="small">The · cat · sat + on</text>
  <path class="flow" marker-start="url(#arrow)" d="M302 366H381"/>
  <text x="341" y="353" text-anchor="middle" class="small">read / add</text>
  <path class="flow" d="M163 388V408"/>
  <rect class="box" x="28" y="410" width="270" height="52" rx="5"/>
  <text x="163" y="432" text-anchor="middle">Final norm → LM head</text>
  <text x="163" y="452" text-anchor="middle" class="small">Vocabulary logits → softmax</text>
  <path class="flow" d="M163 462V482"/>
  <rect class="current" x="28" y="484" width="270" height="48" rx="5"/>
  <text x="163" y="514" text-anchor="middle" class="label">Select next token, e.g. the</text>
  <text x="385" y="435" class="small"><tspan x="385" dy="0">The old tokens’ K, V stay saved.</tspan><tspan x="385" dy="22">Only “on” travels through</tspan><tspan x="385" dy="22">the model in this pass.</tspan><tspan x="385" dy="32">Next pass: process “the”.</tspan></text>
</svg>
