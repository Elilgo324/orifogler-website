<svg xmlns="http://www.w3.org/2000/svg" width="640" height="620" viewBox="0 0 640 620" role="img" aria-labelledby="title desc">
  <title id="title">Inside one transformer layer during cached decoding</title>
  <desc id="desc">The current token representation is normalized and projected to a new query, key, and value. Append the new key and value to this layer's cache for The, cat, and sat. The new query compares against all four keys, and the resulting attention weights combine all four values. Complete the block with head merging, output projection, residual connections, normalization, and the MLP, then send the updated representation to the next layer. The query is not stored for future tokens.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#52675e"/></marker></defs>
  <style>text{font-family:Arial,sans-serif;fill:#25352e;font-size:16px}.small{font-size:13px;fill:#52675e}.label{font-weight:700}.box{fill:#fff;stroke:#aab8af;stroke-width:1.5}.current{fill:#edf3fa;stroke:#54779c;stroke-width:1.5}.cache{fill:#eef5ed;stroke:#6a876b;stroke-width:1.5}.flow{fill:none;stroke:#52675e;stroke-width:1.7;marker-end:url(#arrow)}</style>
  <rect width="640" height="620" fill="#fff"/>
  <text x="26" y="25" class="small">ZOOM IN · ONE LAYER, ONE NEW TOKEN</text>
  <rect class="current" x="26" y="44" width="330" height="46" rx="5"/>
  <text x="191" y="72" text-anchor="middle" class="label">Current representation of “on”</text>
  <path class="flow" d="M191 90V110"/>
  <rect class="box" x="26" y="112" width="330" height="66" rx="5"/>
  <text x="191" y="138" text-anchor="middle">Normalize → Q, K, V projections</text>
  <text x="191" y="161" text-anchor="middle" class="small">Apply position handling, e.g. RoPE to Q, K</text>
  <path class="flow" d="M111 178V214"/><path class="flow" d="M282 178V214"/>
  <rect class="current" x="26" y="216" width="170" height="54" rx="5"/>
  <text x="111" y="240" text-anchor="middle" class="label">Q for “on”</text>
  <text x="111" y="259" text-anchor="middle" class="small">Used now; not cached</text>
  <rect class="current" x="216" y="216" width="140" height="54" rx="5"/>
  <text x="286" y="240" text-anchor="middle" class="label">K, V for “on”</text>
  <text x="286" y="259" text-anchor="middle" class="small">New activations</text>
  <rect class="cache" x="436" y="112" width="178" height="182" rx="5"/>
  <text x="525" y="138" text-anchor="middle" class="label">This layer’s cache</text>
  <text x="525" y="166" text-anchor="middle" class="small">Already saved K, V</text>
  <text x="525" y="192" text-anchor="middle">The · cat · sat</text>
  <path d="M448 209H602" stroke="#aab8af"/>
  <rect class="current" x="450" y="223" width="150" height="51" rx="4"/>
  <text x="525" y="244" text-anchor="middle" class="label">+ K, V for “on”</text>
  <text x="525" y="263" text-anchor="middle" class="small">Keep for later tokens</text>
  <path class="flow" d="M356 245H446"/><text x="396" y="231" text-anchor="middle" class="small">append</text>
  <path class="flow" d="M111 270V348"/>
  <path class="flow" d="M525 294V348"/>
  <text x="509" y="327" text-anchor="end" class="small">Read all 4 positions</text>
  <rect class="box" x="26" y="350" width="588" height="78" rx="5"/>
  <text x="320" y="377" text-anchor="middle" class="label">Attention for the new token</text>
  <text x="320" y="402" text-anchor="middle">Compare Q with all K → softmax → weighted sum of all V</text>
  <path class="flow" d="M320 428V450"/>
  <rect class="box" x="26" y="452" width="588" height="83" rx="5"/>
  <text x="320" y="478" text-anchor="middle" class="label">Finish the transformer block</text>
  <text x="320" y="500" text-anchor="middle" class="small">Merge heads → output projection → residual add</text>
  <text x="320" y="521" text-anchor="middle" class="small">Normalization → MLP → residual add</text>
  <path class="flow" d="M320 535V555"/>
  <rect class="current" x="121" y="557" width="398" height="46" rx="5"/>
  <text x="320" y="586" text-anchor="middle" class="label">Updated “on” representation → next layer</text>
</svg>
