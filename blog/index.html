<head>

  <link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      color-scheme: light;
      --green-950: #102c29;
      --green-900: #173d39;
      --green-800: #24534d;
      --ink: #202724;
      --text: #46504b;
      --muted: #707a74;
      --paper: #fffefb;
      --canvas: #f7f3eb;
      --gold: #c99542;
      --gold-light: #e3c27f;
      --line: rgba(23, 61, 57, 0.15);
      --serif: "Frank Ruhl Libre", "Noto Serif Hebrew", Georgia, serif;
      --sans: "Assistant", "Segoe UI", Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--ink);
      background: var(--canvas);
      font-family: var(--sans);
      line-height: 1.65;
      -webkit-font-smoothing: antialiased;
    }
    body.dialog-open { overflow: hidden; }
    a { color: inherit; text-decoration: none; }
    button { font: inherit; }
    a, button { -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 3px solid var(--gold); outline-offset: 3px; }
    ::selection { color: var(--green-950); background: #f3d9a7; }
    .shell { width: min(1080px, calc(100% - 40px)); margin-inline: auto; }

    .skip-link {
      position: fixed;
      inset: 10px 10px auto auto;
      z-index: 100;
      padding: 9px 14px;
      border-radius: 999px;
      color: #fff;
      background: var(--green-900);
      transform: translateY(-160%);
    }
    .skip-link:focus { transform: translateY(0); }

    .site-header, .hero { color: #fff; background: var(--green-900); }
    .site-header { border-bottom: 1px solid rgba(255, 255, 255, 0.12); }
    .nav {
      min-height: 66px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 20px;
    }
    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--serif);
      font-size: 1.15rem;
      font-weight: 700;
    }
    .brand-mark {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(243, 215, 162, 0.38);
      border-radius: 50%;
      color: #f3d7a2;
    }
    .brand-mark svg { width: 17px; height: 17px; }
    .hero { padding-block: clamp(42px, 6vw, 64px); }
    .hero h1 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(2.8rem, 6vw, 4.5rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1;
    }
    .hero p {
      margin: 15px 0 0;
      color: rgba(255, 255, 255, 0.66);
      font-size: 1.05rem;
    }

    .content-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      align-items: start;
      gap: 28px;
      padding-block: clamp(54px, 7vw, 82px);
    }
    .books {
      position: sticky;
      top: 24px;
      overflow: hidden;
      border: 1px solid var(--line);
      background: var(--paper);
    }
    .books h2 {
      margin: 0;
      padding: 16px 18px;
      border-bottom: 1px solid var(--line);
      color: var(--green-900);
      font-size: 0.9rem;
    }
    .book-link {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 17px 18px;
      border-bottom: 1px solid var(--line);
      transition: background 160ms ease;
    }
    .book-link:last-child { border-bottom: 0; }
    .book-link:hover { background: #f1f5f2; }
    .book-link strong { display: block; font-family: var(--serif); font-size: 1.05rem; }
    .book-link span { display: block; margin-top: 1px; color: var(--muted); font-size: 0.78rem; }
    .book-link svg { flex: none; width: 18px; height: 18px; color: var(--green-800); }

    .posts-section { min-width: 0; }
    .section-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .section-heading h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.85rem, 3.5vw, 2.5rem);
      font-weight: 600;
    }
    .posts {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 18px;
    }
    .card {
      min-width: 0;
      min-height: 370px;
      display: flex;
      flex-direction: column;
      padding: clamp(24px, 3vw, 32px);
      border: 1px solid var(--line);
      background: var(--paper);
      transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
      animation: card-in 420ms ease both;
    }
    .card-featured {
      grid-column: 1 / -1;
      min-height: 390px;
      padding: clamp(30px, 5vw, 50px);
      border-color: rgba(23, 61, 57, 0.22);
      background: #edf2ef;
    }
    .card:nth-of-type(2) { animation-delay: 60ms; }
    .card:nth-of-type(3) { animation-delay: 120ms; }
    .card:nth-of-type(4) { animation-delay: 180ms; }
    .card:hover {
      border-color: rgba(23, 61, 57, 0.3);
      box-shadow: 0 16px 38px rgba(32, 39, 36, 0.07);
      transform: translateY(-3px);
    }
    .post-meta {
      min-height: 24px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 18px;
      color: var(--muted);
      font-size: 0.82rem;
      font-weight: 600;
    }
    .post-meta .dot { width: 3px; height: 3px; border-radius: 50%; background: currentColor; opacity: 0.55; }
    .new-label {
      padding: 2px 8px 3px;
      border-radius: 999px;
      color: var(--green-900);
      background: #e6efeb;
      font-size: 0.68rem;
    }
    .post-title {
      margin: 0;
      font-family: var(--serif);
      font-size: clamp(1.75rem, 3vw, 2.15rem);
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.12;
    }
    .card-featured .post-title {
      max-width: 680px;
      font-size: clamp(2.35rem, 5vw, 3.65rem);
    }
    .post-excerpt {
      margin: 17px 0 24px;
      color: var(--text);
      font-size: 0.98rem;
      line-height: 1.75;
    }
    .card-featured .post-excerpt { max-width: 700px; font-size: 1.05rem; }
    .previous-label {
      grid-column: 1 / -1;
      margin: 10px 0 -4px;
      color: var(--muted);
      font-size: 0.86rem;
      font-weight: 700;
    }
    .post-actions { display: flex; align-items: center; gap: 12px; margin-top: auto; }
    .read-button {
      min-height: 40px;
      padding: 0 16px;
      border: 1px solid var(--green-900);
      border-radius: 4px;
      color: #fff;
      background: var(--green-900);
      font-weight: 700;
      cursor: pointer;
    }
    .read-button:hover { background: var(--green-800); }
    .share-button {
      min-height: 40px;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--green-900);
      background: transparent;
      font-weight: 700;
      cursor: pointer;
    }
    .share-button:hover { border-color: var(--green-800); background: #fff; }
    .share-button svg { width: 16px; height: 16px; }

    .loading-card { min-height: 300px; }
    .loading-card:first-child { grid-column: 1 / -1; min-height: 390px; background: #edf2ef; }
    .skeleton { overflow: hidden; position: relative; border-radius: 999px; background: rgba(23, 61, 57, 0.09); }
    .skeleton::after {
      position: absolute;
      inset: 0;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.7), transparent);
      content: "";
      transform: translateX(-100%);
      animation: shimmer 1.5s infinite;
    }
    .skeleton-meta { width: 130px; height: 11px; }
    .skeleton-title { width: 70%; height: 32px; margin-top: 26px; border-radius: 4px; }
    .skeleton-copy { width: 95%; height: 12px; margin-top: 30px; }
    .skeleton-copy.short { width: 63%; margin-top: 11px; }
    .empty-state {
      grid-column: 1 / -1;
      padding: 54px 24px;
      border: 1px solid var(--line);
      text-align: center;
      background: var(--paper);
    }
    .empty-state h3 { margin: 0 0 6px; font-family: var(--serif); font-size: 1.5rem; }
    .empty-state p { margin: 0 0 18px; color: var(--muted); }
    .empty-state a { color: var(--green-800); font-weight: 700; text-decoration: underline; }

    .article-dialog {
      width: min(820px, calc(100% - 32px));
      max-height: min(90vh, 920px);
      margin: auto;
      padding: 0;
      border: 0;
      color: var(--ink);
      background: var(--paper);
      box-shadow: 0 28px 90px rgba(8, 24, 22, 0.3);
    }
    .article-dialog::backdrop { background: rgba(10, 28, 26, 0.76); backdrop-filter: blur(3px); }
    .dialog-bar {
      position: sticky;
      top: 0;
      z-index: 2;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      background: rgba(255, 254, 251, 0.96);
    }
    .dialog-actions { display: flex; align-items: center; gap: 9px; }
    .dialog-button, .dialog-close {
      min-height: 38px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--green-900);
      background: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    .dialog-button:hover, .dialog-close:hover { border-color: var(--green-800); background: #f1f5f2; }
    .dialog-button svg { width: 16px; height: 16px; }
    .dialog-close { width: 38px; padding: 0; font-size: 1.4rem; font-weight: 400; }
    .article-reading { max-width: 66ch; margin-inline: auto; padding: clamp(38px, 7vw, 72px) clamp(24px, 7vw, 64px) 80px; }
    .article-reading time { color: var(--muted); font-size: 0.9rem; }
    .article-reading h2 {
      margin: 10px 0 32px;
      font-family: var(--serif);
      font-size: clamp(2.4rem, 7vw, 4rem);
      font-weight: 600;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }
    .article-body { font-family: var(--serif); font-size: 1.15rem; line-height: 1.95; }
    .article-body p { margin: 0 0 1.3em; }
    .print-sheet { display: none; }

    .site-footer { border-top: 1px solid var(--line); background: rgba(255, 254, 251, 0.55); }
    .footer-inner {
      min-height: 100px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      gap: 24px;
      color: var(--muted);
      font-size: 0.88rem;
    }
    .footer-brand { color: var(--green-900); font-family: var(--serif); font-weight: 700; }

    @keyframes card-in { from { opacity: 0; transform: translateY(10px); } }
    @keyframes shimmer { to { transform: translateX(100%); } }

    @media (max-width: 980px) {
      .content-layout { grid-template-columns: 1fr; }
      .books { position: static; display: grid; grid-template-columns: auto 1fr 1fr; }
      .books h2 { display: flex; align-items: center; border-bottom: 0; border-inline-end: 1px solid var(--line); }
      .book-link { border-bottom: 0; border-inline-end: 1px solid var(--line); }
      .book-link:last-child { border-inline-end: 0; }
    }
    @media (max-width: 800px) {
      .posts { grid-template-columns: 1fr; }
      .card-featured, .loading-card:first-child { grid-column: auto; }
      .card { min-height: 0; }
    }
    @media (max-width: 560px) {
      .shell { width: min(100% - 28px, 1080px); }
      .hero { padding-block: 38px 44px; }
      .hero h1 { font-size: 3rem; }
      .hero p { max-width: 290px; font-size: 0.98rem; }
      .content-layout { gap: 42px; }
      .books { grid-template-columns: 1fr; }
      .books h2 { min-height: 48px; border-inline-end: 0; border-bottom: 1px solid var(--line); }
      .book-link { min-height: 72px; border-inline-end: 0; border-bottom: 1px solid var(--line); }
      .book-link:last-child { border-bottom: 0; }
      .section-heading { align-items: flex-start; flex-direction: column; }
      .article-dialog { width: 100%; max-width: none; height: 100%; max-height: none; }
      .article-reading { padding-top: 36px; }
      .footer-inner { align-items: flex-start; flex-direction: column; padding-block: 28px; }
    }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    @media print {
      @page { margin: 18mm; }
      body.printing-article { background: #fff; }
      body.printing-article > * { display: none !important; }
      body.printing-article > .print-sheet {
        display: block !important;
        max-width: 720px;
        margin: 0 auto;
        color: #000;
        font-family: var(--serif);
        direction: rtl;
      }
      .print-sheet h1 { margin: 0 0 8px; font-size: 30pt; line-height: 1.1; }
      .print-sheet time { display: block; margin-bottom: 28px; color: #555; font: 11pt var(--sans); }
      .print-sheet p { margin: 0 0 12pt; font-size: 13pt; line-height: 1.75; }
    }
  </style>
</head>

  <script>
    const posts = document.getElementById("posts");
    const dialog = document.getElementById("article-dialog");
    const dialogTitle = document.getElementById("dialog-title");
    const dialogDate = document.getElementById("dialog-date");
    const dialogBody = document.getElementById("dialog-body");
    const printSheet = document.getElementById("print-sheet");
    let activeArticle = null;
    let originalDocumentTitle = document.title;
    let articlesById = new Map();

    function paragraphsFromHtml(html, title) {
      const container = document.createElement("div");
      container.innerHTML = html;
      container.querySelectorAll("script, style, iframe, object, embed, form, noscript").forEach((node) => node.remove());
      const paragraphs = Array.from(container.querySelectorAll("p"))
        .map((paragraph) => paragraph.textContent.replace(/\s+/g, " ").trim())
        .filter((text) => text && text !== title);
      if (paragraphs.length) return paragraphs;
      const text = container.textContent.replace(/\s+/g, " ").trim();
      return text && text !== title ? [text] : [];
    }

    function articleData(entry) {
      const title = entry.title?.$t?.trim() || "מאמר ללא כותרת";
      const html = entry.content?.$t ?? entry.summary?.$t ?? "";
      const paragraphs = paragraphsFromHtml(html, title);
      const fullText = paragraphs.join(" ");
      const published = entry.published?.$t ?? entry.updated?.$t ?? "";
      const parsedDate = published ? new Date(published) : null;
      const date = parsedDate && !Number.isNaN(parsedDate.getTime()) ? parsedDate : null;
      const bloggerId = entry.id?.$t?.match(/post-(\d+)/)?.[1];
      const fallbackId = Array.from(`${title}-${published}`).reduce((hash, character) => ((hash * 31) + character.charCodeAt(0)) >>> 0, 0).toString(36);
      return { id: bloggerId || fallbackId, title, paragraphs, fullText, date };
    }

    function formattedDate(date) {
      if (!date) return "";
      return new Intl.DateTimeFormat("he-IL", { day: "numeric", month: "long", year: "numeric" }).format(date);
    }

    function readingTime(text) {
      return Math.max(2, Math.round(text.split(/\s+/).filter(Boolean).length / 180));
    }

    function excerpt(text, maxLength = 210) {
      if (text.length <= maxLength) return text;
      const shortened = text.slice(0, maxLength);
      const lastSpace = shortened.lastIndexOf(" ");
      return `${shortened.slice(0, lastSpace > maxLength * 0.75 ? lastSpace : maxLength).trim()}…`;
    }

    function appendParagraphs(container, paragraphs) {
      container.innerHTML = "";
      const fragment = document.createDocumentFragment();
      paragraphs.forEach((text) => {
        const paragraph = document.createElement("p");
        paragraph.textContent = text;
        fragment.appendChild(paragraph);
      });
      container.appendChild(fragment);
    }

    function articleUrl(article) {
      const url = new URL(window.location.href);
      url.searchParams.set("article", article.id);
      url.hash = "";
      return url.toString();
    }

    function setArticleInUrl(article) {
      window.history.replaceState(null, "", articleUrl(article));
    }

    function clearArticleFromUrl() {
      const url = new URL(window.location.href);
      url.searchParams.delete("article");
      window.history.replaceState(null, "", url);
    }

    function openArticle(article, updateUrl = true) {
      activeArticle = article;
      dialogTitle.textContent = article.title;
      dialogDate.textContent = formattedDate(article.date);
      dialogDate.dateTime = article.date?.toISOString() || "";
      appendParagraphs(dialogBody, article.paragraphs);
      document.body.classList.add("dialog-open");
      if (!dialog.open) dialog.showModal();
      if (updateUrl) setArticleInUrl(article);
    }

    function closeArticle() {
      if (dialog.open) dialog.close();
      document.body.classList.remove("dialog-open");
      clearArticleFromUrl();
    }

    function copiedFeedback(button) {
      const label = button.querySelector("span");
      const originalLabel = label.textContent;
      label.textContent = "הקישור הועתק";
      window.setTimeout(() => { label.textContent = originalLabel; }, 1800);
    }

    function copyFallback(text) {
      const field = document.createElement("textarea");
      field.value = text;
      field.style.position = "fixed";
      field.style.opacity = "0";
      document.body.appendChild(field);
      field.select();
      document.execCommand("copy");
      field.remove();
    }

    async function shareArticle(article, button) {
      const url = articleUrl(article);
      try {
        if (navigator.share) {
          await navigator.share({ title: article.title, text: `${article.title} — הגיגי אמרי`, url });
          return;
        }
        await navigator.clipboard.writeText(url);
        copiedFeedback(button);
      } catch (error) {
        if (error?.name === "AbortError") return;
        copyFallback(url);
        copiedFeedback(button);
      }
    }

    function buildPrintSheet(article) {
      printSheet.innerHTML = "";
      const title = document.createElement("h1");
      title.textContent = article.title;
      const date = document.createElement("time");
      date.textContent = formattedDate(article.date);
      const body = document.createElement("div");
      appendParagraphs(body, article.paragraphs);
      printSheet.append(title, date, body);
    }

    function finishPrinting() {
      document.body.classList.remove("printing-article");
      document.title = originalDocumentTitle;
    }

    function printArticle() {
      if (!activeArticle) return;
      buildPrintSheet(activeArticle);
      originalDocumentTitle = document.title;
      document.title = `${activeArticle.title} — הגיגי אמרי`;
      document.body.classList.add("printing-article");
      window.print();
      window.setTimeout(finishPrinting, 500);
    }

    function createMeta(article, isNewest) {
      const meta = document.createElement("div");
      meta.className = "post-meta";
      if (isNewest) {
        const label = document.createElement("span");
        label.className = "new-label";
        label.textContent = "חדש";
        meta.appendChild(label);
      }
      if (article.date) {
        const time = document.createElement("time");
        time.dateTime = article.date.toISOString();
        time.textContent = formattedDate(article.date);
        meta.appendChild(time);
      }
      const dot = document.createElement("span");
      dot.className = "dot";
      dot.setAttribute("aria-hidden", "true");
      const duration = document.createElement("span");
      duration.textContent = `${readingTime(article.fullText)} דקות`;
      meta.append(dot, duration);
      return meta;
    }

    function buildPostCard(article, index) {
      const card = document.createElement("article");
      card.className = `card${index === 0 ? " card-featured" : ""}`;
      card.appendChild(createMeta(article, index === 0));

      const heading = document.createElement("h3");
      heading.className = "post-title";
      heading.textContent = article.title;
      const summary = document.createElement("p");
      summary.className = "post-excerpt";
      summary.textContent = excerpt(article.fullText, index === 0 ? 330 : 150);

      const actions = document.createElement("div");
      actions.className = "post-actions";
      const readButton = document.createElement("button");
      readButton.className = "read-button";
      readButton.type = "button";
      readButton.textContent = "פתיחת המאמר";
      readButton.addEventListener("click", () => openArticle(article));
      actions.appendChild(readButton);
      if (index === 0) {
        const shareButton = document.createElement("button");
        shareButton.className = "share-button";
        shareButton.type = "button";
        shareButton.innerHTML = `<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="15" cy="5" r="2.2"/><circle cx="5" cy="10" r="2.2"/><circle cx="15" cy="15" r="2.2"/><path d="m7 9 6-3m-6 5 6 3"/></svg><span>שיתוף</span>`;
        shareButton.addEventListener("click", () => shareArticle(article, shareButton));
        actions.appendChild(shareButton);
      }
      card.append(heading, summary, actions);
      return card;
    }

    function showEmptyState() {
      posts.innerHTML = `<div class="empty-state"><h3>לא ניתן לטעון את המאמרים</h3><p>כדאי לנסות שוב בעוד כמה רגעים.</p></div>`;
      posts.setAttribute("aria-busy", "false");
    }

    function renderSharedArticle(data) {
      if (!data?.entry) return;
      openArticle(articleData(data.entry), false);
    }

    function loadSharedArticle(id) {
      if (!/^\d+$/.test(id)) return;
      const script = document.createElement("script");
      script.src = `https://hagigey.blogspot.com/feeds/posts/default/${encodeURIComponent(id)}?alt=json-in-script&callback=renderSharedArticle`;
      script.addEventListener("load", () => script.remove());
      script.addEventListener("error", () => script.remove());
      document.body.appendChild(script);
    }

    function renderHagigey(data) {
      const entries = data?.feed?.entry ?? [];
      if (!entries.length) { showEmptyState(); return; }
      posts.innerHTML = "";
      const visibleArticles = entries.slice(0, 4).map(articleData);
      articlesById = new Map(visibleArticles.map((article) => [article.id, article]));
      posts.appendChild(buildPostCard(visibleArticles[0], 0));
      if (visibleArticles.length > 1) {
        const previousLabel = document.createElement("p");
        previousLabel.className = "previous-label";
        previousLabel.textContent = "מאמרים קודמים";
        posts.appendChild(previousLabel);
      }
      visibleArticles.slice(1).forEach((article, index) => posts.appendChild(buildPostCard(article, index + 1)));
      posts.setAttribute("aria-busy", "false");

      const requestedId = new URL(window.location.href).searchParams.get("article");
      const requestedArticle = requestedId ? articlesById.get(requestedId) : null;
      if (requestedArticle) openArticle(requestedArticle, false);
      else if (requestedId) loadSharedArticle(requestedId);
    }

    document.getElementById("dialog-close").addEventListener("click", closeArticle);
    document.getElementById("print-button").addEventListener("click", printArticle);
    dialog.addEventListener("close", () => {
      document.body.classList.remove("dialog-open");
      clearArticleFromUrl();
    });
    dialog.addEventListener("click", (event) => { if (event.target === dialog) closeArticle(); });
    window.addEventListener("afterprint", finishPrinting);
    window.setTimeout(() => { if (posts.getAttribute("aria-busy") === "true") showEmptyState(); }, 12000);
  </script>
  <script src="https://hagigey.blogspot.com/feeds/posts/default?alt=json-in-script&amp;max-results=4&amp;callback=renderHagigey"></script>
</body>
</html>
