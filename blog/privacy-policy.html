<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>מדיניות הפרטיות עברה לכתובת חדשה</title>
    <meta http-equiv="refresh" content="0; url=../privacy.html" />
    <link rel="canonical" href="https://orifogler.com/privacy.html" />
    <meta
      name="description"
      content="מדיניות פרטיות עבור הצגת פרסומות באתר."
    />
    <style>
      :root {
        color-scheme: light;
        --ink-900: #16171a;
        --ink-700: #2f3138;
        --ink-500: #5b606e;
        --paper-100: #ffffff;
        --paper-200: #f6f3ef;
        --shadow: 0 18px 50px rgba(26, 27, 31, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Rubik", "Assistant", "Heebo", "Noto Sans Hebrew",
          "Segoe UI", system-ui, -apple-system, sans-serif;
        background: var(--paper-200);
        color: var(--ink-900);
        line-height: 1.75;
      }

      .page {
        min-height: 100vh;
        display: grid;
        gap: 24px;
        padding: 56px 6vw 72px;
      }

      .card {
        background: var(--paper-100);
        border-radius: 28px;
        padding: clamp(24px, 4vw, 44px);
        box-shadow: var(--shadow);
        display: grid;
        gap: 18px;
      }

      h1 {
        margin: 0;
        font-size: clamp(30px, 4vw, 46px);
      }

      h2 {
        margin: 0;
        font-size: 1.2rem;
        color: var(--ink-700);
      }

      p {
        margin: 0;
        color: var(--ink-700);
      }

      a {
        color: var(--ink-900);
        font-weight: 600;
        text-decoration: underline;
        text-underline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main class="page">
      <section class="card">
        <h1>מדיניות הפרטיות עברה</h1>
        <p>אם לא הועברת אוטומטית, אפשר להמשיך אל <a href="../privacy.html">מדיניות הפרטיות המעודכנת</a>.</p>
      </section>
    </main>
  </body>
</html>
