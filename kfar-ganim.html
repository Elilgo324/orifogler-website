<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>כפר גנים על המפה</title>
  <meta name="description" content="מפת המקומות המשפחתיים שלנו בכפר גנים, פתח תקווה." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon"
    href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='16' fill='%230c1b18'/><circle cx='32' cy='29' r='15' fill='%23ff7657'/><path d='M32 14c-6 0-11 5-11 11 0 9 11 23 11 23s11-14 11-23c0-6-5-11-11-11Zm0 16a5 5 0 1 1 0-10 5 5 0 0 1 0 10Z' fill='white'/></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://unpkg.com" />
  <link rel="preconnect" href="https://services.arcgisonline.com" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700;800&amp;family=Frank+Ruhl+Libre:wght@500;600;700&amp;display=swap" />
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />

  <style>
    :root {
      color-scheme: dark;
      --night: #08110f;
      --ink: #f8f3e9;
      --muted: #aab8b2;
      --glass: rgba(9, 22, 19, 0.85);
      --line: rgba(255, 255, 255, 0.13);
      --orange: #ff7657;
      --mint: #65d1b6;
      --shadow: 0 34px 90px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 6% 4%, rgba(101, 209, 182, 0.12), transparent 30rem),
        radial-gradient(circle at 98% 90%, rgba(255, 118, 87, 0.12), transparent 34rem),
        var(--night);
      font-family: "Assistant", Arial, sans-serif;
      line-height: 1.45;
      -webkit-font-smoothing: antialiased;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(1560px, 100%);
      min-height: 100svh;
      margin: 0 auto;
      padding: clamp(18px, 3vw, 46px);
      display: grid;
      grid-template-rows: auto minmax(610px, 1fr) auto;
      gap: 24px;
    }

    .topbar {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 36px;
    }

    .title-wrap {
      display: flex;
      align-items: flex-end;
      gap: clamp(18px, 3vw, 42px);
    }

    .compass {
      width: 54px;
      height: 54px;
      flex: 0 0 auto;
      display: grid;
      place-items: center;
      margin-bottom: 5px;
      border: 1px solid var(--line);
      border-radius: 50%;
      color: var(--orange);
      background: rgba(255, 255, 255, 0.04);
    }

    .compass svg, .action-button svg {
      width: 23px;
      height: 23px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .eyebrow {
      margin: 0 0 6px;
      color: var(--mint);
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--ink);
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: clamp(3.1rem, 5.8vw, 6.2rem);
      font-weight: 600;
      letter-spacing: -0.055em;
      line-height: 0.86;
    }

    .actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .action-button, .view-button {
      min-height: 46px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 0 17px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.055);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: transform 160ms ease, border-color 160ms ease, background 160ms ease;
    }

    .action-button:hover, .action-button:focus-visible,
    .view-button:hover, .view-button:focus-visible {
      border-color: rgba(255, 255, 255, 0.32);
      background: rgba(255, 255, 255, 0.1);
      transform: translateY(-2px);
      outline: none;
    }

    .action-button.primary {
      border-color: var(--orange);
      color: #171411;
      background: var(--orange);
    }

    .action-button.primary:hover, .action-button.primary:focus-visible { background: #ff8d73; }
    .action-button svg { width: 18px; height: 18px; stroke-width: 2; }

    .map-stage {
      position: relative;
      min-height: 0;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 36px;
      background: #1f2926;
      box-shadow: var(--shadow);
      isolation: isolate;
    }

    #map {
      position: absolute;
      inset: 0;
      z-index: 1;
      background: #1f2926;
    }

    .map-stage::after {
      position: absolute;
      inset: 0;
      z-index: 2;
      background: linear-gradient(90deg, rgba(8, 17, 15, 0.3), transparent 42%, rgba(8, 17, 15, 0.05));
      content: "";
      pointer-events: none;
    }

    .map-panel {
      position: absolute;
      z-index: 500;
      top: 22px;
      right: 22px;
      bottom: 22px;
      width: min(365px, calc(100% - 44px));
      display: flex;
      flex-direction: column;
      padding: 23px;
      overflow: auto;
      border: 1px solid rgba(255, 255, 255, 0.17);
      border-radius: 25px;
      background: var(--glass);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.34);
      backdrop-filter: blur(22px) saturate(1.2);
    }

    .panel-kicker {
      margin: 0;
      color: var(--mint);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
    }

    .map-panel h2 {
      margin: 7px 0 5px;
      font-family: "Frank Ruhl Libre", Georgia, serif;
      font-size: 2rem;
      font-weight: 600;
      line-height: 1;
    }

    .panel-intro {
      margin: 0 0 17px;
      color: var(--muted);
      font-size: 0.87rem;
    }

    .place-list { display: grid; gap: 8px; }

    .place-card {
      width: 100%;
      min-height: 66px;
      display: grid;
      grid-template-columns: 42px minmax(0, 1fr) 22px;
      align-items: center;
      gap: 11px;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 17px;
      color: var(--ink);
      background: rgba(255, 255, 255, 0.035);
      text-align: right;
      cursor: pointer;
      transition: border-color 160ms ease, background 160ms ease, transform 160ms ease;
    }

    .place-card:hover, .place-card:focus-visible, .place-card.active {
      border-color: rgba(255, 255, 255, 0.2);
      background: rgba(255, 255, 255, 0.105);
      transform: translateX(-3px);
      outline: none;
    }

    .place-icon {
      width: 42px;
      height: 42px;
      display: grid;
      place-items: center;
      border-radius: 14px;
      color: #101714;
      background: var(--pin-color);
      box-shadow: 0 8px 24px color-mix(in srgb, var(--pin-color), transparent 68%);
    }

    .place-icon svg, .marker-dot svg {
      width: 21px;
      height: 21px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .place-copy strong { display: block; font-size: 0.97rem; line-height: 1.2; }

    .place-copy span {
      display: block;
      margin-top: 4px;
      overflow: hidden;
      color: var(--muted);
      font-size: 0.76rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .card-arrow {
      color: rgba(255, 255, 255, 0.45);
      font-size: 1.1rem;
      transform: scaleX(-1);
    }

    .panel-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: auto;
      padding-top: 18px;
      color: var(--muted);
      font-size: 0.74rem;
    }

    .panel-footer a { color: var(--ink); font-weight: 700; text-decoration: none; }
    .panel-footer a:hover { text-decoration: underline; }

    .map-tools {
      position: absolute;
      z-index: 500;
      top: 22px;
      left: 22px;
      display: flex;
      direction: rtl;
      padding: 4px;
      border: 1px solid rgba(255, 255, 255, 0.18);
      border-radius: 999px;
      background: rgba(8, 17, 15, 0.74);
      box-shadow: 0 12px 36px rgba(0, 0, 0, 0.26);
      backdrop-filter: blur(16px);
    }

    .view-button {
      min-height: 38px;
      padding: 0 15px;
      border: 0;
      color: rgba(255, 255, 255, 0.68);
      background: transparent;
      font-size: 0.82rem;
    }

    .view-button:hover, .view-button:focus-visible { transform: none; }
    .view-button.active { color: #101714; background: var(--ink); }

    .map-hint {
      position: absolute;
      z-index: 500;
      left: 22px;
      bottom: 22px;
      margin: 0;
      padding: 9px 13px;
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 999px;
      color: rgba(255, 255, 255, 0.8);
      background: rgba(8, 17, 15, 0.72);
      font-size: 0.74rem;
      backdrop-filter: blur(14px);
      pointer-events: none;
    }

    .page-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      color: #81918b;
      font-size: 0.76rem;
    }

    .custom-marker { border: 0; background: transparent; }

    .marker-dot {
      position: relative;
      width: 50px;
      height: 50px;
      display: grid;
      place-items: center;
      border: 4px solid rgba(255, 255, 255, 0.95);
      border-radius: 50%;
      color: #101714;
      background: var(--pin-color);
      box-shadow: 0 9px 28px rgba(0, 0, 0, 0.45), 0 0 0 7px rgba(255, 255, 255, 0.14);
      transition: transform 160ms ease;
    }

    .marker-dot::after {
      position: absolute;
      bottom: -10px;
      left: 50%;
      width: 3px;
      height: 11px;
      border-radius: 2px;
      background: #fff;
      content: "";
      transform: translateX(-50%);
    }

    .custom-marker:hover .marker-dot { transform: translateY(-4px) scale(1.04); }
    .leaflet-tile-pane { filter: saturate(0.92) contrast(1.07) brightness(0.82); }
    .street-view .leaflet-tile-pane { filter: saturate(0.75) contrast(1.03) brightness(0.9); }

    .leaflet-popup-content-wrapper, .leaflet-popup-tip { color: var(--ink); background: #11221e; }

    .leaflet-popup-content-wrapper {
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 18px;
      box-shadow: 0 18px 42px rgba(0, 0, 0, 0.4);
    }

    .leaflet-popup-content {
      width: 218px !important;
      margin: 16px 18px;
      direction: rtl;
      text-align: right;
      font-family: "Assistant", Arial, sans-serif;
    }

    .popup-title { display: block; font-size: 1rem; }
    .popup-address { margin: 4px 0 13px; color: var(--muted); font-size: 0.8rem; }

    .popup-nav {
      min-height: 36px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 14px;
      border-radius: 10px;
      color: #101714 !important;
      background: var(--mint);
      font-size: 0.8rem;
      font-weight: 800;
      text-decoration: none;
    }

    .leaflet-container .leaflet-control-attribution {
      color: rgba(255, 255, 255, 0.72);
      background: rgba(8, 17, 15, 0.68);
    }

    .leaflet-container .leaflet-control-attribution a { color: #fff; }

    .leaflet-control-zoom {
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.18) !important;
      border-radius: 13px !important;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.24) !important;
    }

    .leaflet-control-zoom a {
      border-color: rgba(255, 255, 255, 0.12) !important;
      color: #fff !important;
      background: rgba(8, 17, 15, 0.84) !important;
    }

    @media (max-width: 880px) {
      .page { padding: 18px 14px 26px; grid-template-rows: auto auto auto; }
      .topbar { align-items: flex-start; flex-direction: column; gap: 20px; }
      .title-wrap { align-items: center; }
      .compass { width: 45px; height: 45px; margin-bottom: 0; }
      h1 { font-size: clamp(3rem, 14vw, 5rem); }

      .map-stage {
        min-height: 0;
        display: grid;
        grid-template-rows: minmax(430px, 58svh) auto;
        overflow: visible;
        border-radius: 25px;
        background: transparent;
      }

      #map {
        position: relative;
        min-height: 430px;
        overflow: hidden;
        border-radius: 25px 25px 0 0;
      }

      .map-stage::after { bottom: auto; height: 58svh; min-height: 430px; }

      .map-panel {
        position: relative;
        inset: auto;
        width: 100%;
        max-height: none;
        padding: 22px 16px 18px;
        border-radius: 0 0 25px 25px;
        backdrop-filter: none;
      }

      .map-panel h2, .panel-intro { display: none; }
      .place-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .map-tools { top: 14px; left: 14px; }
      .map-hint { display: none; }
      .panel-footer { margin-top: 14px; }
    }

    @media (max-width: 570px) {
      .title-wrap { gap: 12px; }
      .compass { display: none; }
      .actions { width: 100%; }
      .action-button { flex: 1; }
      .place-list { grid-template-columns: 1fr; }
      .page-footer { align-items: flex-start; flex-direction: column; gap: 3px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .action-button, .view-button, .place-card, .marker-dot { transition: none; }
    }

    @page { size: A4 landscape; margin: 8mm; }

    @media print {
      :root { color-scheme: light; }
      html, body { width: 100%; height: auto; color: #10201c; background: #fff; }
      body { print-color-adjust: exact; -webkit-print-color-adjust: exact; }

      .page {
        width: 100%;
        min-height: 0;
        padding: 0;
        grid-template-rows: auto 172mm auto;
        gap: 5mm;
      }

      .topbar { align-items: center; }
      .eyebrow { color: #336f62; }
      h1 { color: #10201c; font-size: 36pt; }
      .compass { border-color: #cad4d0; color: #d95f45; }
      .actions, .map-tools, .map-hint, .leaflet-control-zoom { display: none !important; }

      .map-stage {
        min-height: 0;
        overflow: hidden;
        border-color: #bbc7c2;
        border-radius: 7mm;
        box-shadow: none;
      }

      .map-panel {
        top: 5mm;
        right: 5mm;
        bottom: 5mm;
        width: 76mm;
        padding: 5mm;
        overflow: hidden;
        border-color: rgba(255, 255, 255, 0.28);
        border-radius: 5mm;
        background: rgba(9, 22, 19, 0.9);
        box-shadow: none;
      }

      .place-card { min-height: 14mm; break-inside: avoid; }
      .panel-footer { display: none; }
      .page-footer { color: #53615c; }
    }
  </style>
</head>

<body>
  <main class="page">
    <header class="topbar">
      <div class="title-wrap">
        <div>
          <p class="eyebrow">האנשים והמקומות שלנו · פתח תקווה</p>
          <h1>כפר גנים על המפה</h1>
        </div>
        <span class="compass" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15.8 8.2-2.2 5.4-5.4 2.2 2.2-5.4z"/></svg>
        </span>
      </div>

      <div class="actions">
        <button class="action-button primary" id="print-button" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9V3h12v6"/><path d="M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 14h12v7H6z"/></svg>
          הדפסת המפה
        </button>
        <a class="action-button" href="./">חזרה לאתר</a>
      </div>
    </header>

    <section class="map-stage" aria-label="מפת המקומות בכפר גנים">
      <div id="map" role="application" aria-label="מפה אינטראקטיבית עם חמישה מקומות בכפר גנים"></div>

      <aside class="map-panel" aria-labelledby="places-title">
        <p class="panel-kicker">5 נקודות קרובות</p>
        <h2 id="places-title">המעגל שלנו</h2>
        <p class="panel-intro">לחצו על מקום כדי להתקרב אליו ולפתוח ניווט.</p>
        <div class="place-list" id="place-list"></div>
        <div class="panel-footer">
          <span>מפה פרטית · ללא אינדוקס</span>
          <a href="./">orifogler.com</a>
        </div>
      </aside>

      <div class="map-tools" role="group" aria-label="בחירת סגנון מפה">
        <button class="view-button active" data-layer="satellite" type="button">צילום לוויין</button>
        <button class="view-button" data-layer="streets" type="button">מפת רחובות</button>
      </div>

      <p class="map-hint">גררו כדי לטייל · גללו כדי להתקרב</p>
    </section>

    <footer class="page-footer">
      <span>כפר גנים · פתח תקווה</span>
      <span id="map-credit">צילום לוויין ומפה © Esri</span>
    </footer>
  </main>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const icons = {
      parents: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8"/><path d="M5 10v10h14V10"/><path d="M12 17.2s-3.1-1.8-3.1-4.1a1.8 1.8 0 0 1 3.1-1.2 1.8 1.8 0 0 1 3.1 1.2c0 2.3-3.1 4.1-3.1 4.1z"/></svg>',
      couple: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="8" r="3"/><circle cx="16" cy="8" r="3"/><path d="M2.5 20c.4-4 2.1-6 5.5-6s5.1 2 5.5 6"/><path d="M10.5 16c.9-1.3 2.7-2 5.5-2 3.4 0 5.1 2 5.5 6"/></svg>',
      synagogue: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 21V9l7-6 7 6v12"/><path d="M3 21h18"/><path d="M9 21v-6h6v6"/><path d="m12 6 .8 1.6 1.7.2-1.2 1.3.3 1.8-1.6-.8-1.6.8.3-1.8-1.2-1.3 1.7-.2z"/></svg>'
    };

    const places = [
      { name: 'בית ההורים', address: 'ויצמן 39, פתח תקווה', lat: 32.0767962, lng: 34.8732414, icon: 'parents', color: '#ff7657' },
      { name: 'אורי ושירה', address: 'נחום ניר 18, פתח תקווה', lat: 32.0785704, lng: 34.8766945, icon: 'couple', color: '#65d1b6' },
      { name: 'יוני ואיילה', address: 'דגל ראובן 42, פתח תקווה', lat: 32.0820873, lng: 34.8733357, icon: 'couple', color: '#f2c563' },
      { name: 'בית הכנסת קהל חסידים', address: 'אליהו דוד שולזינגר 3, פתח תקווה', lat: 32.0766153, lng: 34.8769877, icon: 'synagogue', color: '#b5a0ff' },
      { name: 'סבא איצ׳ו וסבתא תחיה', address: 'אבא אחימאיר 11, פתח תקווה', lat: 32.0732278, lng: 34.8832796, icon: 'parents', color: '#62b8e7' }
    ];

    const map = L.map('map', { zoomControl: true, scrollWheelZoom: false });

    const satelliteLayer = L.tileLayer(
      'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      { maxZoom: 19, attribution: 'Tiles &copy; Esri — Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community' }
    );

    const streetsLayer = L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
    });

    satelliteLayer.addTo(map);
    map.attributionControl.setPrefix(false);

    const bounds = L.latLngBounds([]);
    const list = document.getElementById('place-list');

    places.forEach((place, index) => {
      const markerIcon = L.divIcon({
        className: 'custom-marker',
        html: `<span class="marker-dot" style="--pin-color:${place.color}">${icons[place.icon]}</span>`,
        iconSize: [50, 60],
        iconAnchor: [25, 58],
        popupAnchor: [0, -54]
      });

      const navigationUrl = `https://www.google.com/maps/search/?api=1&query=${encodeURIComponent(place.address)}`;
      const marker = L.marker([place.lat, place.lng], { icon: markerIcon, title: place.name, keyboard: true })
        .addTo(map)
        .bindPopup(`
          <strong class="popup-title">${place.name}</strong>
          <p class="popup-address">${place.address}</p>
          <a class="popup-nav" href="${navigationUrl}" target="_blank" rel="noopener noreferrer">פתיחה לניווט</a>
        `);

      marker.on('click', () => setActive(index));
      bounds.extend([place.lat, place.lng]);

      const button = document.createElement('button');
      button.type = 'button';
      button.className = 'place-card';
      button.dataset.index = index;
      button.style.setProperty('--pin-color', place.color);
      button.setAttribute('aria-label', `הצגת ${place.name} על המפה`);
      button.innerHTML = `
        <span class="place-icon">${icons[place.icon]}</span>
        <span class="place-copy"><strong>${place.name}</strong><span>${place.address}</span></span>
        <span class="card-arrow" aria-hidden="true">←</span>
      `;
      button.addEventListener('click', () => {
        map.flyTo([place.lat, place.lng], 17, { duration: 0.7 });
        marker.openPopup();
        setActive(index);
      });
      list.appendChild(button);
    });

    function setActive(index) {
      document.querySelectorAll('.place-card').forEach((card) => {
        card.classList.toggle('active', Number(card.dataset.index) === index);
      });
    }

    document.querySelectorAll('.view-button').forEach((button) => {
      button.addEventListener('click', () => {
        const isSatellite = button.dataset.layer === 'satellite';
        if (isSatellite) {
          map.removeLayer(streetsLayer);
          satelliteLayer.addTo(map);
          map.getContainer().classList.remove('street-view');
          document.getElementById('map-credit').textContent = 'צילום לוויין ומפה © Esri';
        } else {
          map.removeLayer(satelliteLayer);
          streetsLayer.addTo(map);
          map.getContainer().classList.add('street-view');
          document.getElementById('map-credit').textContent = 'נתוני מפה © OpenStreetMap';
        }

        document.querySelectorAll('.view-button').forEach((item) => item.classList.toggle('active', item === button));
      });
    });

    document.getElementById('print-button').addEventListener('click', () => {
      map.closePopup();
      map.fitBounds(bounds, { padding: [70, 70], maxZoom: 16 });
      setTimeout(() => window.print(), 350);
    });

    window.addEventListener('beforeprint', () => {
      map.invalidateSize();
      map.fitBounds(bounds, { padding: [55, 55], maxZoom: 16, animate: false });
    });

    window.addEventListener('afterprint', () => setTimeout(() => map.invalidateSize(), 100));

    map.fitBounds(bounds, {
      paddingTopLeft: [400, 85],
      paddingBottomRight: [80, 85],
      maxZoom: 16
    });
  </script>
</body>
</html>
